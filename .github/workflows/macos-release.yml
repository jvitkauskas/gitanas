name: macOS release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (manual runs upload artifacts only)'
        required: true
        default: '0.0.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Set release version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH, optionally followed by -preview.1 or similar" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          cd eng
          dotnet run set_version_to.cs -- -v "${version%%-*}" -t "$version"

      - name: Build, bundle, and ad-hoc sign
        env:
          RID: ${{ matrix.rid }}
        run: bash eng/macos/build.sh "$RID" "$RELEASE_VERSION"

      - name: Check packaged application starts
        env:
          RID: ${{ matrix.rid }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          app = Path('artifacts/macos') / os.environ['RID'] / 'Gitanas.app/Contents/MacOS/Gitanas'
          with tempfile.TemporaryDirectory() as cwd:
              process = subprocess.Popen([str(app.resolve())], cwd=cwd)
              try:
                  time.sleep(15)
                  if process.poll() is not None:
                      raise SystemExit(f'Application exited during startup: {process.returncode}')
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY

      - name: Upload release files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-${{ matrix.rid }}
          path: artifacts/macos/${{ matrix.rid }}/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true

      - name: Create release and attach both builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          ## macOS downloads

          - **osx-arm64**: Apple Silicon Macs (M1 and later).
          - **osx-x64**: Intel Macs.
          - Requires macOS 14 or later. The .NET runtime is included; install Git separately.

          Extract the ZIP and drag **Gitanas.app** to Applications. These builds are ad-hoc signed, not notarized by Apple. After the first blocked launch, use **System Settings → Privacy & Security → Open Anyway** if you trust this download.

          SHA-256 checksum files are included alongside each ZIP.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Gitanas $RELEASE_TAG" --notes-file notes.md "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
