name: Release builds

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (manual runs upload artifacts only)'
        required: true
        default: '0.0.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: windows-2025
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Set release version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH, optionally followed by -preview.1 or similar" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          cd eng
          dotnet run set_version_to.cs -- -v "${version%%-*}" -t "$version"

      - name: Install macOS disk image tools
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install --require-hashes -r eng/macos/requirements-dmg.txt
          echo "$RUNNER_TEMP/dmg-tools/bin" >> "$GITHUB_PATH"

      - name: Build, sign, and package macOS DMG
        if: runner.os == 'macOS'
        env:
          RID: ${{ matrix.rid }}
        run: bash eng/macos/build.sh "$RID" "$RELEASE_VERSION"

      - name: Build framework-dependent Windows ZIP
        if: runner.os == 'Windows'
        env:
          RID: ${{ matrix.rid }}
        run: python eng/windows/build.py "$RID" "$RELEASE_VERSION"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git openssh-client ca-certificates libicu74 libssl3t64 libgssapi-krb5-2 \
            libfontconfig1 libx11-6 libice6 libsm6 libxext6 libxrender1 libxrandr2 libxi6 \
            libxcursor1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 \
            libegl1 libgl1 libdbus-1-3 fonts-dejavu-core xvfb xauth

      - name: Build self-contained Linux archive
        if: runner.os == 'Linux'
        env:
          RID: ${{ matrix.rid }}
        run: python3 eng/linux/build.py "$RID" "$RELEASE_VERSION"

      - name: Check Linux archive starts after extraction
        if: runner.os == 'Linux'
        env:
          RID: ${{ matrix.rid }}
          GITEXTENSIONS_USE_WAYLAND: '0'
        run: xvfb-run -a python3 eng/linux/smoke-test.py artifacts/linux/"$RID"/dist/*.tar.gz

      - name: Check Windows ZIP starts after extraction
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem "artifacts/windows/$env:RID/dist/*.zip")
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP" }
          $zip = $zips[0]
          $destination = Join-Path $env:RUNNER_TEMP "gitanas-$env:RID"
          Expand-Archive $zip.FullName $destination
          $app = Join-Path $destination 'Gitanas/Gitanas.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'gitanas-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'gitanas-stderr.log'
          $started = Get-Date
          $process = Start-Process $app -WorkingDirectory $env:RUNNER_TEMP -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) {
              Get-Content $stdout, $stderr
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started} -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error') } |
                Format-List TimeCreated, ProviderName, Message
              throw "Application exited during startup: $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Check macOS packaged application starts
        if: runner.os == 'macOS'
        env:
          RID: ${{ matrix.rid }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          app = Path('artifacts/macos') / os.environ['RID'] / 'dmg-installed/Gitanas.app/Contents/MacOS/Gitanas'
          with tempfile.TemporaryDirectory() as cwd:
              process = subprocess.Popen([str(app.resolve())], cwd=cwd)
              try:
                  time.sleep(15)
                  if process.poll() is not None:
                      raise SystemExit(f'Application exited during startup: {process.returncode}')
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY

      - name: Upload macOS Finder preview
        if: runner.os == 'macOS' && (success() || failure())
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dmg-preview-${{ matrix.rid }}
          path: artifacts/macos/${{ matrix.rid }}/preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release files
        if: success() || failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'macos' }}/${{ matrix.rid }}/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release and attach all builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          ## Windows downloads

          - **win-x64-framework-dependent**: 64-bit Intel/AMD Windows.
          - **win-arm64-framework-dependent**: Windows on ARM.
          - Requires the matching architecture's **.NET 10 Runtime** (`Microsoft.NETCore.App`), installed separately. The SDK and Desktop Runtime are not required.

          Extract the entire ZIP into a writable folder and run **Gitanas.exe**. If .NET is missing, the launcher offers a download link; install the runtime and start the app again. These ZIPs store settings alongside the application. Install Git separately. Windows binaries are unsigned.

          ## macOS downloads

          - **osx-arm64**: Apple Silicon Macs (M1 and later).
          - **osx-x64**: Intel Macs.
          - Requires macOS 14 or later. The .NET runtime is included; install Git separately.

          Open the DMG and drag **Gitanas** onto **Applications**. Open Gitanas from Applications. If macOS blocks it, go to **System Settings → Privacy & Security → Open Anyway**, then confirm. These builds are ad-hoc signed, not notarized by Apple.

          ## Linux downloads

          - **linux-x64**: 64-bit Intel/AMD Linux.
          - **linux-arm64**: 64-bit ARM Linux.
          - Self-contained: .NET 10 is included. Install Git separately.

          Extract the entire `.tar.gz` and run `./Gitanas` inside the extracted `Gitanas` directory. These builds target glibc-based desktop distributions; they still require system graphics libraries, fonts, ICU, and OpenSSL. Alpine/musl is not supported by these archives. Settings are kept in your user configuration/data directories. Native Wayland is experimental; set `GITEXTENSIONS_USE_WAYLAND=0` for X11/XWayland. See [Linux packaging](https://github.com/jvitkauskas/gitanas/blob/main/eng/linux/README.md) for dependencies and usage.

          SHA-256 checksum files are included alongside each archive.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Gitanas $RELEASE_TAG" --notes-file notes.md "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/*.tar.gz dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
